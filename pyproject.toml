[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arctrellis"
version = "0.1.0"
description = "Evidence-first repository intelligence: prove how your codebase works."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter==0.25.2",
    "tree-sitter-python==0.25.0",
    "tree-sitter-javascript==0.25.0",
    "tree-sitter-typescript==0.23.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
arctrellis = "arctrellis.cli.main:entry_point"

[project.optional-dependencies]
dev = ["ruff==0.16.10", "mypy==2.4.0"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
files = ["src/arctrellis"]
strict = true
